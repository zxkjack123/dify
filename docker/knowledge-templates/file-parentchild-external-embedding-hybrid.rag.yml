          selected: false
          is_array_file: false
          variable_selector:
            - '2001'
            - file
      - id: '2003'
        type: custom
        height: 129
        width: 242
        position:
          x: 320
          y: 280
        positionAbsolute:
          x: 320
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
