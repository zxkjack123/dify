            - markdown
            - mdx
            - pdf
            - html
            - xlsx
            - xls
            - vtt
            - properties
            - doc
            - docx
            - csv
            - eml
            - msg
            - pptx
            - xml
            - epub
            - ppt
            - md
      - id: '2002'
        type: custom
        height: 90
        width: 242
        position:
          x: -110
          y: 360
        positionAbsolute:
          x: -110
          y: 360
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          type: document-extractor
