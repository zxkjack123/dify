kind: rag_pipeline
version: 0.1.0
rag_pipeline:
  name: file-parentchild-external-embedding-hybrid
  description: Parent-child chunking for files using external OpenAI-compatible embeddings (sudon-sd-bge-m3) and hybrid retrieval.
  icon_type: emoji
  icon: 📙
  icon_background: "#FFF4ED"
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
