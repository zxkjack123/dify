                zh_Hans: 子分块分隔符
              type: string
              form: llm
              required: false
              default: "\n"
            - name: parent_mode
              label:
                en_US: Parent Mode
                zh_Hans: 父块模式
              type: select
              form: llm
              required: true
              default: paragraph
              options:
                - value: paragraph
                  label:
                    en_US: Paragraph
                    zh_Hans: 段落
                - value: full_doc
                  label:
                    en_US: Full Document
                    zh_Hans: 全文
            - name: remove_extra_spaces
              label:
                en_US: Remove Extra Spaces
                zh_Hans: 移除多余空格
              type: boolean
              form: llm
              required: false
              default: 0
            - name: remove_urls_emails
              label:
                en_US: Remove URLs and Emails
                zh_Hans: 移除URL和电子邮件地址
              type: boolean
              form: llm
              required: false
              default: 0
          params:
            input_text: ''
            max_length: ''
            separator: ''
            subchunk_max_length: ''
            subchunk_separator: ''
            parent_mode: ''
            remove_extra_spaces: ''
            remove_urls_emails: ''
          tool_parameters:
            input_text:
              type: mixed
              value: '{{#2003.output#}}'
            max_length:
              type: variable
              value:
                - rag
                - shared
                - max_chunk_length
            separator:
              type: variable
              value:
                - rag
                - shared
                - delimiter
            subchunk_max_length:
              type: variable
              value:
                - rag
                - shared
                - child_max_chunk_length
            subchunk_separator:
              type: variable
              value:
                - rag
                - shared
                - child_delimiter
            parent_mode:
              type: variable
              value:
                - rag
                - shared
                - parent_mode
            remove_extra_spaces:
              type: variable
              value:
                - rag
                - shared
                - replace_consecutive_spaces
            remove_urls_emails:
              type: variable
              value:
                - rag
                - shared
                - delete_urls_email
          tool_configurations: {}
    edges:
      - id: 2001-source-2002-target
