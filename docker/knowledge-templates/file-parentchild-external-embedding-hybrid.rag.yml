            group_enabled: false
            groups:
              - groupId: 11111111-1111-1111-1111-111111111111
                group_name: Group1
                output_type: string
                variables:
                  - - '2002'
                    - text
      - id: '2004'
        type: custom
        height: 52
        width: 242
        position:
          x: 640
          y: 280
        positionAbsolute:
          x: 640
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
