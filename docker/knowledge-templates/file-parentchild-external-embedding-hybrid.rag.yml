                zh_Hans: 输入文本
              type: string
              form: llm
              required: true
              human_description:
                en_US: The text you want to chunk.
                zh_Hans: 你想要分块的文本。
            - name: max_length
              label:
                en_US: Maximum Length
                zh_Hans: 最大长度
              type: number
              form: llm
              required: false
              default: 1024
            - name: separator
              label:
                en_US: Chunk Separator
