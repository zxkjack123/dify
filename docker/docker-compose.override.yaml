## docker-compose.override.yaml - SSD tuned, external embedding, Qdrant, CPU-capped vectorization (<= 6 cores total)

services:
  api:
    environment:
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_GRPC_ENABLED: "true"
      QDRANT_CLIENT_TIMEOUT: 120

      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://localhost:8000/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-changeme}

      SERVER_WORKER_AMOUNT: "2"
      SERVER_WORKER_CONNECTIONS: "500"
      LOG_LEVEL: INFO
      SQLALCHEMY_POOL_SIZE: "100"
      SQLALCHEMY_MAX_OVERFLOW: "50"
      SQLALCHEMY_POOL_TIMEOUT: "30"
      SQLALCHEMY_POOL_PRE_PING: "true"
      SQLALCHEMY_POOL_USE_LIFO: "true"
      INDEXING_MAX_SEGMENTATION_TOKENS_LENGTH: "6000"
      ENABLE_DATASETS_QUEUE_MONITOR: "true"
      QUEUE_MONITOR_INTERVAL: "15"
      ENABLE_CLEAN_EMBEDDING_CACHE_TASK: "true"
      CLEAN_EMBEDDING_CACHE_DAY_SETTING: "7"
      # Upload limits
      UPLOAD_FILE_SIZE_LIMIT: "50"
      UPLOAD_FILE_BATCH_LIMIT: "1000"
      BATCH_UPLOAD_LIMIT: "1000"
      # Allow long-running uploads
      GUNICORN_TIMEOUT: "1800"

    volumes:
      - ./volumes/app/storage:/app/api/storage

    extra_hosts:
      - "${EMBEDDING_HOST_1:-localhost}:${EMBEDDING_HOST_IP_1:-127.0.0.1}"

  worker:
    environment:
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_GRPC_ENABLED: "true"
      QDRANT_CLIENT_TIMEOUT: 120

      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://localhost:8000/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-changeme}

      MODE: worker
      CELERY_WORKER_CLASS: gevent
      CELERY_AUTO_SCALE: "false"
      CELERY_WORKER_AMOUNT: "2"
      CELERY_QUEUES: generation,mail,ops_trace,app_deletion,plugin,workflow_storage,conversation
      CELERYD_MAX_TASKS_PER_CHILD: "500"
      LOG_LEVEL: INFO
      SQLALCHEMY_POOL_SIZE: "60"
      SQLALCHEMY_MAX_OVERFLOW: "30"
      SQLALCHEMY_POOL_TIMEOUT: "30"
      SQLALCHEMY_POOL_PRE_PING: "true"
      SQLALCHEMY_POOL_USE_LIFO: "true"
      # Upload limits for any file-processing endpoints invoked by worker
      UPLOAD_FILE_SIZE_LIMIT: "50"
      UPLOAD_FILE_BATCH_LIMIT: "1000"
      BATCH_UPLOAD_LIMIT: "1000"

    volumes:
      - ./volumes/app/storage:/app/api/storage

    extra_hosts:
      - "${EMBEDDING_HOST_1:-localhost}:${EMBEDDING_HOST_IP_1:-127.0.0.1}"
    cpus: "0.5"

  worker_dataset:
    image: langgenius/dify-api:1.9.1
    restart: always
    environment:
      MODE: worker
      CELERY_WORKER_CLASS: gevent
      CELERY_AUTO_SCALE: "false"
      CELERY_WORKER_AMOUNT: "16"
      CELERY_QUEUES: dataset
      CELERYD_MAX_TASKS_PER_CHILD: "1000"
      CELERYD_PREFETCH_MULTIPLIER: "4"
      LOG_LEVEL: INFO
      SQLALCHEMY_POOL_SIZE: "120"
      SQLALCHEMY_MAX_OVERFLOW: "60"
      SQLALCHEMY_POOL_TIMEOUT: "30"
      SQLALCHEMY_POOL_PRE_PING: "true"
      SQLALCHEMY_POOL_USE_LIFO: "true"
      INDEXING_MAX_SEGMENTATION_TOKENS_LENGTH: "6000"
      VECTOR_STORE_BATCH_SIZE: "500"
      # Upload limits for dataset ingestion flows
      UPLOAD_FILE_SIZE_LIMIT: "50"
      UPLOAD_FILE_BATCH_LIMIT: "1000"
      BATCH_UPLOAD_LIMIT: "1000"
      OPENDAL_SCHEME: ${OPENDAL_SCHEME:-fs}
      OPENDAL_FS_ROOT: ${OPENDAL_FS_ROOT:-storage}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-difyai123456}
      DB_DATABASE: ${DB_DATABASE:-dify}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-difyai123456}
      REDIS_DB: ${REDIS_DB:-0}
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_GRPC_ENABLED: "true"
      QDRANT_CLIENT_TIMEOUT: 120
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://localhost:8000/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-changeme}
      PLUGIN_DAEMON_URL: ${PLUGIN_DAEMON_URL:-http://plugin_daemon:5002}
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi}
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./volumes/app/storage:/app/api/storage
    extra_hosts:
      - "${EMBEDDING_HOST_1:-localhost}:${EMBEDDING_HOST_IP_1:-127.0.0.1}"
    networks:
      - ssrf_proxy_network
      - default
    cpus: "8"

  plugin_daemon:
    volumes:
      - ./volumes/app/storage:/app/storage
    extra_hosts:
      - "${EMBEDDING_HOST_1:-localhost}:${EMBEDDING_HOST_IP_1:-127.0.0.1}"

  # One-shot helper to persist SiliconFlow provider patch into plugin storage
  plugin_patch:
    image: python:3.12-alpine
    restart: "no"
    depends_on:
      plugin_daemon:
        condition: service_started
    volumes:
      - ./plugin_patches:/patches:ro
      - ./volumes/app/storage:/app/storage
    entrypoint: ["sh", "/patches/run_patch.sh"]

  qdrant:
    profiles:
      - ""
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    cpus: "1"

  weaviate:
    profiles:
      - "weaviate"

  worker_beat:
    environment:
      LOG_LEVEL: INFO
      SQLALCHEMY_POOL_SIZE: "10"
      SQLALCHEMY_MAX_OVERFLOW: "5"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      ENABLE_DATASETS_QUEUE_MONITOR: "true"
      QUEUE_MONITOR_INTERVAL: "15"
      ENABLE_CLEAN_EMBEDDING_CACHE_TASK: "true"
      CLEAN_EMBEDDING_CACHE_DAY_SETTING: "7"
    extra_hosts:
      - "${EMBEDDING_HOST_1:-localhost}:${EMBEDDING_HOST_IP_1:-127.0.0.1}"
    cpus: "0.25"

  db:
    command: >
      postgres
      -c 'max_connections=300'
      -c 'shared_buffers=16GB'
      -c 'effective_cache_size=80GB'
      -c 'maintenance_work_mem=4GB'
      -c 'work_mem=64MB'
      -c 'wal_buffers=32MB'
      -c 'min_wal_size=4GB'
      -c 'max_wal_size=16GB'
      -c 'checkpoint_completion_target=0.9'
      -c 'random_page_cost=1.1'
      -c 'effective_io_concurrency=200'
      -c 'max_worker_processes=12'
      -c 'max_parallel_workers_per_gather=4'
      -c 'max_parallel_workers=12'
      -c 'max_parallel_maintenance_workers=6'
      -c 'synchronous_commit=off'
      -c 'wal_compression=on'
      -c 'wal_writer_delay=200ms'
      -c 'commit_delay=100'
      -c 'commit_siblings=10'
      -c 'autovacuum_max_workers=6'
      -c 'autovacuum_naptime=10s'
      -c 'autovacuum_vacuum_scale_factor=0.05'
      -c 'autovacuum_analyze_scale_factor=0.025'
      -c 'default_statistics_target=500'
      -c 'log_min_duration_statement=2000'
      -c 'log_checkpoints=on'
      -c 'log_connections=off'
      -c 'log_disconnections=off'
      -c 'log_lock_waits=on'
      -c 'log_temp_files=0'
      -c 'track_io_timing=on'
      -c 'track_functions=pl'
      -c 'jit=on'
      -c 'huge_pages=try'
      -c 'temp_buffers=32MB'
      -c 'max_locks_per_transaction=256'
    shm_size: 4gb

  redis:
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-difyai123456}
      --maxmemory 8gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --stop-writes-on-bgsave-error no
      --rdbcompression yes
      --rdbchecksum yes
      --appendonly yes
      --appendfsync everysec
      --no-appendfsync-on-rewrite yes
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 128mb
      --hz 10
      --dynamic-hz yes
      --activerehashing yes
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
      --lazyfree-lazy-server-del yes
      --replica-lazy-flush yes
      --lazyfree-lazy-user-del yes
      --io-threads 4
      --io-threads-do-reads yes

  nginx:
    environment:
      NGINX_WORKER_PROCESSES: "12"
      NGINX_WORKER_CONNECTIONS: "4096"
    extra_hosts:
      - "${EMBEDDING_HOST_1:-localhost}:${EMBEDDING_HOST_IP_1:-127.0.0.1}"
    cpus: "0.5"

  sandbox:
    environment:
      SANDBOX_WORKER_TIMEOUT: "30"
      SANDBOX_ENABLE_NETWORK: "true"
