app:
  description: "Classify input sentiment into configured labels."
  icon: "📊"
  icon_background: "#FFF1E6"
  mode: advanced-chat
  name: "${app_name}"
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    edges:
      - id: start-to-llm
        source: start
        sourceHandle: source
        target: classifier
        targetHandle: target
      - id: llm-to-answer
        source: classifier
        sourceHandle: source
        target: answer
        targetHandle: target
    nodes:
      - data:
          desc: ""
          title: Start
          type: start
          variables: []
        id: start
        position:
          x: 80
          y: 260
        sourcePosition: right
        targetPosition: left
        type: custom
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ""
          memory:
            query_prompt_template: "{{#sys.query#}}"
            window:
              enabled: false
              size: 10
          model:
            completion_params:
              temperature: 0.1
            mode: chat
            name: "${model}"
            provider: "openai"
          prompt_template:
            - role: system
              text: |-
                You are a sentiment analysis assistant. Review the user input and return a JSON payload with:
                  - sentiment: one of ${tone_labels}
                  - rationale: short explanation referencing the input
                Output JSON only.
          selected: true
          title: Sentiment Classifier
          type: llm
          variables: []
          vision:
            enabled: false
        id: classifier
        position:
          x: 360
          y: 260
        sourcePosition: right
        targetPosition: left
        type: custom
      - data:
          answer: "{{#classifier.text#}}"
          desc: ""
          title: Answer
          type: answer
          variables: []
        id: answer
        position:
          x: 640
          y: 260
        sourcePosition: right
        targetPosition: left
        type: custom
