            - 输出评分理由ao3_credit_reason\n- 不对Eassy中AO1和AO2部分进行评价\n- 在对经济学论文进行评分时，评估部分（Evaluation）必须体现出对题目中的问题的多维度分析，并且明确指出哪些因素可能影响其有效性。评估部分的重点是讨论和评估在不同条件下，某一理论或现象是否成立，或者其影响是否具有普遍性。\n\
            \    - 不能单方面评估：任何“单一立场”的回答都不应获得评估分数。\n    - 依赖因素（Depend-On Factors）：评估部分必须清楚地指出在什么条件下某一经济理论、现象或政策会有效或无效，分析其背后的依赖因素。\n\
