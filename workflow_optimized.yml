        prompt_template:
        - id: 90454da7-11e8-4ce9-bea1-905a9ec590c4
          role: system
          text: "{{#1753368722561.text#}}是一个学生的经济学作文（英语）。\n{{#1755352505623.item#}}是教师对部分内容的点评意见。\n\
            根据点评意见，在知识库中检索到了相关知识：{{#context#}}\n请综合点评意见和相关知识，为该点评内容完善分析内容，生成一段点评分析。\n\
            \n## 要求\n- 点评分析要包含点评本身，点评意见的分析，分析中应该引用知识库中检索到的相关知识，给出知识来源\n- 如果是负面的点评意见，则在点评意见中添加修改建议的内容\n\
