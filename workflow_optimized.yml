          \         item = re.sub(r'^\\*+|\\*+$', '', item)\n            if item:\n\
          \                keyword_lines.append(item)\n    else:\n        # 按行处理\n\
          \        for line in content.split('\\n'):\n            line = line.strip()\n\
          \            if not line or line.startswith('#'):\n                continue\n\
          \            # 移除项目符号和加粗\n            clean_line = re.sub(r'^[\\s*•\\-]+\\\
          s*|\\d+[\\.\\)]\\s*', '', line)\n            clean_line = re.sub(r'^\\*+|\\\
          *+$', '', clean_line)\n            # 只取冒号前内容（如\"High inflation: ...\"）\n\
          \            clean_line = clean_line.split(\n                ':')[0].strip()\
          \ if ':' in clean_line else clean_line\n            if clean_line:\n   \
          \             keyword_lines.append(clean_line)\n\n    # 二次清洗：移除首尾标点和重复\n\
          \    cleaned_keywords = []\n    seen = set()\n    for kw in keyword_lines:\n\
          \        kw = re.sub(r'^[,.;\\s]+|[,.;\\s]+$', '', kw)\n        if kw and\
          \ kw not in seen:\n            cleaned_keywords.append(kw)\n           \
          \ seen.add(kw)\n\n    return cleaned_keywords\n\n\ndef split_by_sentences(content:\
          \ str) -> list:\n    \"\"\"\n    将内容按句子分割\n    \"\"\"\n    if not content:\n\
          \        return []\n\n    # 简单的句子分割，基于句号、问号、感叹号\n    sentences = re.split(r'[.!?]',\
          \ content)\n    sentences = [s.strip() for s in sentences if s.strip()]\n\
          \    return sentences\n\n\ndef main(arg1: str) -> dict:\n    \"\"\"\n  \
          \  主函数，根据指定类型分割内容\n\n    参数:\n        arg1: 要分割的内容\n    注意: 请在代码中手动设置split_type和其他参数的值\n\
          \    \"\"\"\n    # 用户需要手动设置这些参数值\n    # 请根据需要修改: \"delimiters\", \"lines\"\
          , \"paragraphs\", \"sentences\", \"factors\", \"logics\", \"keywords\"\n\
          \    split_type = \"lines\"\n    skip_first_line = False           # 是否跳过第一行\
          \ (仅对lines类型有效)\n    keyword = \"\"                      # 关键词参数 (仅对lines类型有效)\n\
          \n    if split_type == \"delimiters\":\n        result = split_by_delimiters(arg1)\n\
          \    elif split_type == \"lines\":\n        result = split_by_lines(arg1,\
          \ skip_first_line, keyword)\n    elif split_type == \"paragraphs\":\n  \
          \      result = split_by_paragraphs(arg1)\n    elif split_type == \"sentences\"\
          :\n        result = split_by_sentences(arg1)\n    elif split_type == \"\
          factors\":\n        result = split_by_factors(arg1)\n    elif split_type\
          \ == \"logics\":\n        result = split_by_logics(arg1)\n    elif split_type\
          \ == \"keywords\":\n        result = split_by_keywords(arg1)\n    else:\n\
          \        # 默认按行分割\n        result = split_by_lines(arg1)\n\n    return {\n\
          \        \"result\": result,\n        \"num_parts\": len(result)\n    }\n\
          \n"
