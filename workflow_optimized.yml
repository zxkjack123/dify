    - data:
        code: "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\nAO1和AO2内容提取脚本\
          \ - 简化版本\n不使用正则表达式，避免DeprecationWarning\n使用简单字符串搜索方法提取AO1和AO2内容\n不处理转义字符，避免警告\n\
          \"\"\"\n\n\ndef clean_text(text):\n    \"\"\"\n    清理文本，移除think标签，不处理转义字符\n\
          \    \"\"\"\n    if not text:\n        return \"\"\n    \n    # 移除think标签\n\
          \    while '<think>' in text and '</think>' in text:\n        start = text.find('<think>')\n\
          \        end = text.find('</think>') + 8\n        if start >= 0 and end\
          \ > start:\n            text = text[:start] + text[end:]\n        else:\n\
          \            break\n    \n    # 移除残留的think标签\n    text = text.replace('<think>',\
          \ '').replace('</think>', '')\n    \n    # 清理多余的空白行，保持原始格式\n    lines =\
          \ text.split('\\n')\n    cleaned_lines = []\n    for line in lines:\n  \
          \      # 保留原始内容，只去除首尾空格\n        cleaned_line = line.strip()\n        if\
          \ cleaned_line:\n            cleaned_lines.append(cleaned_line)\n    \n\
          \    return '\\n'.join(cleaned_lines)\n\n\ndef find_section_boundaries(text):\n\
          \    \"\"\"\n    找到AO1、AO2、AO3等部分的边界位置\n    \"\"\"\n    text_upper = text.upper()\n\
          \    boundaries = []\n    \n    # 查找所有可能的AO标记\n    ao_markers = [\n    \
          \    'AO1: KNOWLEDGE AND UNDERSTANDING',\n        'AO1:KNOWLEDGE AND UNDERSTANDING',\
          \ \n        'AO1: KNOWLEDGE',\n        'AO1:KNOWLEDGE',\n        'AO1:',\n\
          \        'AO2: ANALYSIS',\n        'AO2:ANALYSIS',\n        'AO2:',\n  \
          \      'AO3: EVALUATION',\n        'AO3:EVALUATION', \n        'AO3:',\n\
          \        '第一种 EVALUATION',\n        '第二种 EVALUATION',\n        '第三种 EVALUATION',\n\
          \        'EVALUATION –',\n        'EVALUATION-',\n        'EVALUATION:',\n\
          \        'FACTOR 1:',\n        'FACTOR 2:',\n        'FACTOR 3:',\n    \
          \    '因素1：',\n        '因素2：',\n        '因素3：',\n        'CONCLUSION',\n\
          \        '结论'\n    ]\n    \n    for marker in ao_markers:\n        pos =\
          \ 0\n        while True:\n            pos = text_upper.find(marker, pos)\n\
          \            if pos == -1:\n                break\n            \n      \
          \      # 确保是在行的开始\n            if pos == 0 or text[pos-1] in '\\n\\r':\n\
          \                boundaries.append({\n                    'position': pos,\n\
          \                    'marker': marker,\n                    'type': get_marker_type(marker)\n\
          \                })\n            pos += 1\n    \n    # 按位置排序\n    boundaries.sort(key=lambda\
          \ x: x['position'])\n    return boundaries\n\n\ndef get_marker_type(marker):\n\
          \    \"\"\"\n    确定标记的类型\n    \"\"\"\n    marker_upper = marker.upper()\n\
          \    if 'AO1' in marker_upper:\n        return 'AO1'\n    elif 'AO2' in\
          \ marker_upper:\n        return 'AO2'\n    elif 'AO3' in marker_upper or\
          \ 'EVALUATION' in marker_upper or 'FACTOR' in marker_upper or '因素' in marker_upper:\n\
          \        return 'AO3'\n    elif 'CONCLUSION' in marker_upper or '结论' in\
          \ marker_upper:\n        return 'AO3'\n    else:\n        return 'UNKNOWN'\n\
          \n\ndef extract_ao1_ao2_content(text):\n    \"\"\"\n    提取AO1和AO2内容，排除AO3\n\
          \    \"\"\"\n    if not text:\n        return \"\"\n    \n    boundaries\
          \ = find_section_boundaries(text)\n    \n    if not boundaries:\n      \
          \  return \"\"\n    \n    # 找到AO1开始位置\n    ao1_start = None\n    ao3_start\
          \ = None\n    \n    for boundary in boundaries:\n        if boundary['type']\
          \ == 'AO1' and ao1_start is None:\n            ao1_start = boundary['position']\n\
          \        elif boundary['type'] == 'AO3' and ao1_start is not None and ao3_start\
          \ is None:\n            ao3_start = boundary['position']\n            break\n\
          \    \n    if ao1_start is None:\n        return \"\"\n    \n    # 如果没有找到AO3开始位置，就提取到文本末尾\n\
          \    if ao3_start is None:\n        ao3_start = len(text)\n    \n    # 提取AO1和AO2部分\n\
          \    extracted = text[ao1_start:ao3_start].strip()\n    return extracted\n\
          \n\ndef extract_specific_section(text, section_type):\n    \"\"\"\n    提取特定部分（AO1或AO2）\n\
          \    \"\"\"\n    if not text:\n        return \"\"\n    \n    boundaries\
          \ = find_section_boundaries(text)\n    \n    if not boundaries:\n      \
          \  return \"\"\n    \n    target_start = None\n    target_end = None\n \
          \   \n    for i, boundary in enumerate(boundaries):\n        if boundary['type']\
          \ == section_type.upper():\n            target_start = boundary['position']\n\
          \            \n            # 找到下一个不同类型的边界作为结束位置\n            for j in range(i\
          \ + 1, len(boundaries)):\n                if boundaries[j]['type'] != section_type.upper():\n\
          \                    target_end = boundaries[j]['position']\n          \
          \          break\n            break\n    \n    if target_start is None:\n\
          \        return \"\"\n    \n    if target_end is None:\n        target_end\
          \ = len(text)\n    \n    # 提取指定部分\n    extracted = text[target_start:target_end].strip()\n\
          \    \n    # 移除开头的标记行\n    lines = extracted.split('\\n')\n    if lines\
          \ and any(marker in lines[0].upper() for marker in ['AO1:', 'AO2:']):\n\
          \        return '\\n'.join(lines[1:]).strip()\n    \n    return extracted\n\
          \n\ndef process_text(input_text, extract_mode=\"both\"):\n    \"\"\"\n \
          \   完整的文本处理流程\n    extract_mode: \"both\" (AO1+AO2), \"ao1\" (只AO1), \"\
          ao2\" (只AO2)\n    \"\"\"\n    if not input_text:\n        return \"\"\n\
          \    \n    # 根据模式提取内容\n    if extract_mode.lower() == \"both\":\n      \
          \  content = extract_ao1_ao2_content(input_text)\n    elif extract_mode.lower()\
          \ == \"ao1\":\n        content = extract_specific_section(input_text, \"\
          AO1\")\n    elif extract_mode.lower() == \"ao2\":\n        content = extract_specific_section(input_text,\
          \ \"AO2\")\n    else:\n        content = extract_ao1_ao2_content(input_text)\n\
          \    \n    # 清理提取的内容\n    if content:\n        content = clean_text(content)\n\
          \    \n    return content if content else \"\"\n\n\ndef main(arg1: str)\
          \ -> dict:\n    \"\"\"\n    主函数，用于Dify Code Block\n    arg1: 输入文本\n    提取AO1和AO2部分，排除AO3评估\n\
          \    \"\"\"\n    try:\n        # 可以修改这个参数来改变提取模式\n        extract_mode =\
          \ \"both\"  # \"both\", \"ao1\", \"ao2\"\n        \n        result_content\
          \ = process_text(arg1, extract_mode)\n        \n        return {\n     \
          \       \"result\": result_content\n        }\n    except Exception as e:\n\
          \        # 健壮的错误处理\n        return {\n            \"result\": \"\"\n   \
          \     }"
        code_language: python3
