            \n# 经济学作为的具体结构\n## 第一部分 AO1: Knowledge and Understanding\n- 包含经济学名词及解释\n\
            - 名词和解释以一句话的形式呈现\n- 通常是作文的第一个段落\n- AO1通常只有1～2个关键词\n\n## 文章第二部分 AO2: Analysis\n\
            - AO2部分一般从作文的第二段开始\n- 对某一话题进行分析，一般包含不超过3个逻辑链条\n- 每个逻辑链条一般一个段落或者几句话\n-\
            \ 每个逻辑链条阐述客观因素间因果关系逻辑\n- 客观因素间表示推导关系的用词有：A causes / produces / generates\
            \ / triggers / induces / enables → B (1.关系直接强烈的adverb:　strongly/directly/clearly/decisively/effectively/dramatically/significantly／absolutely.\
            \ 2.在一定条件下会产生关系的adverb：subsequently/ gradually／steadily／slowly. 3.因果关系的影响较为模糊或不确定的adverb:\
            \ possibly/ probably/ likely／arguably／potentially), which (B) leads to\
            \ / results in / contributes to / brings about / gives rise to / yields\
            \ → C(1.关系直接强烈的adverb: strongly/directly/clearly/decisively/effectively/dramatically/significantly／absolutely.\
            \ 2.在一定条件下会产生关系的adverb：subsequently/ gradually／steadily／slowly. 3.因果关系的影响较为模糊或不确定的adverb:\
            \ possibly/ probably/ likely／arguably／potentially). (Because of/Due to/Since/As/Thanks\
            \ to/On account of/under the condition of 这个是分析时候的条件,可以加也可以不加,optional),\
            \ C drives / affects / influences / determines / shapes / promotes / stimulates\
            \ / accelerates / strengthens / fuels / facilitates / encourages / supports\
            \ → D(1.关系直接强烈的adverb: strongly/directly/clearly/decisively/effectively/dramatically/significantly／absolutely.\
            \ 2.在一定条件下会产生关系的adverb：subsequently/ gradually／steadily／slowly. 3.因果关系的影响较为模糊或不确定的adverb:\
            \ possibly/ probably/ likely／arguably／potentially). Finally / Ultimately\
            \ / Consequently / Hence / Thus / So / Therefore / As a result /， it (D)\
            \ implies that / means that / indicates that / highlights the fact that\
            \ / reflects the idea that / suggests that / demonstrates that / reinforces\
            \ the idea that / illustrates that → E.\n\n## 文章第三部分 AO3: Evaluation and\
            \ conclusion\n- 一般是作为的最后几个段落。\n- 通常以\"To evaluate\"开始。\n- 结构一般为：列举影响因素(depend\
            \ on factors)-逐条评估影响因素(evaluation)-结论(conclusion)。比如AO3第一段扣题，并简单列出depend\
            \ on 的因素。 第二段及其后段落每段开始指明depend on的因素，并进行精练的解释。最后一段给出结论。\n- Depend on 在每段中只出现了一次。\n\
            - Conclusion里不要出现“depend on”的字样，只做精炼的总结。\n\n# 要求\n- 根据经济学作为的一般结构，判断作文的AO1、AO2和AO3部分内容\n\
            - 解析作文中AO1部分的关键词(keywords)。此处的关键词只关键词本身及其解释，一个关键词一般是一个句子。AO2和AO3中涉及的术语均不计入关键词（keywords）\n\
            - 解析作文中AO2部分中的逻辑链条(logics)。此处的逻辑链条(logics)是一个推理过程。\n- 解析作文中AO3部分的评估(evaluation)。此处的评估只的影响因素(depend\
            \ on factor)及其对应的评估过程，一个evaluation的数量是1到2个。\n- 将作文全文中涉及的所有经济学术语（terms）进行总结，给出术语列表\n\
            \n# 输出\n- 输出关键词(keywords)、逻辑链条(logics)、评估(evaluations)和术语(terms)\n- 关键词之间使用换行\"\
            \\n\\n\"分隔\n- 逻辑链条之间使用换行\"\\n\"分隔\n- 评估之间使用换行\"\\n\"分隔\n- 术语(terms)之间使用换行\"\
            \\n\"分隔\n- 使用json输出\n\n```json\n{ \nkeywords: str\nlogics: str\nevaluations:\
            \ str\nterms: str\n}\n```"
