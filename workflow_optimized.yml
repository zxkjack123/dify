    - data:
        code: "import re\nimport html\nimport json\nfrom typing import Optional, Dict,\
          \ Any\n\n\ndef extract_title_from_html(html_content: str) -> Optional[str]:\n\
          \    \"\"\"\n    Extract title from mineru-converted HTML table data.\n\n\
          \    Args:\n        html_content (str): HTML content containing table data\n\
          \n    Returns:\n        Optional[str]: Extracted title or None if not found\n\
          \    \"\"\"\n    try:\n        # Extract table content using regex\n   \
          \     table_pattern = r'<table.*?>(.*?)</table>'\n        tables = re.findall(table_pattern,\
          \ html_content,\n                            re.DOTALL | re.IGNORECASE)\n\
          \n        for table_content in tables:\n            # Extract rows\n   \
          \         row_pattern = r'<tr.*?>(.*?)</tr>'\n            rows = re.findall(row_pattern,\
          \ table_content,\n                              re.DOTALL | re.IGNORECASE)\n\
          \n            if len(rows) >= 2:\n                # Extract cells from first\
          \ row to check headers\n                cell_pattern = r'<td[^>]*>(.*?)</td>'\n\
          \                first_row_cells = re.findall(\n                    cell_pattern,\
          \ rows[0], re.DOTALL | re.IGNORECASE)\n\n                if len(first_row_cells)\
          \ >= 2:\n                    # Clean and check headers\n               \
          \     headers = [html.unescape(\n                        re.sub(r'<[^>]+>',\
          \ '', cell).strip()) for cell in first_row_cells]\n\n                  \
          \  # If we find Question/Answer structure\n                    if 'Question'\
          \ in headers and 'Answer' in headers:\n                        # Look for\
          \ the answer content in subsequent rows\n                        for row\
          \ in rows[1:]:\n                            cells = re.findall(\n      \
          \                          cell_pattern, row, re.DOTALL | re.IGNORECASE)\n\
          \                            if len(cells) >= 2:\n                     \
          \           # Clean the answer text\n                                answer_text\
          \ = html.unescape(\n                                    re.sub(r'<[^>]+>',\
          \ '', cells[1])).strip()\n\n                                # Extract title\
          \ using regex pattern\n                                # Look for text that\
          \ ends with a period before \"Use Table\"\n                            \
          \    title_pattern = r'^(.*?)\\.\\s*Use Table'\n                       \
          \         match = re.search(title_pattern, answer_text)\n\n            \
          \                    if match:\n                                    return\
          \ match.group(1).strip() + '.'\n\n                                # Alternative\
          \ pattern for \"Assess\" questions\n                                assess_pattern\
          \ = r'^(Assess[^.]*\\.)'\n                                match = re.search(assess_pattern,\
          \ answer_text)\n\n                                if match:\n          \
          \                          return match.group(1).strip()\n\n           \
          \                     # Look for other question types\n                \
          \                question_words = [\n                                  \
          \  'evaluate', 'discuss', 'explain', 'analyze', 'compare', 'examine']\n\
          \                                for word in question_words:\n         \
          \                           pattern = rf'^({word.capitalize()}[^.]*\\.)'\n\
          \                                    match = re.search(\n              \
          \                          pattern, answer_text, re.IGNORECASE)\n      \
          \                              if match:\n                             \
          \           return match.group(1).strip()\n\n        return None\n\n   \
          \ except Exception as e:\n        print(f\"Error parsing HTML: {e}\")\n\
          \        return None\n\n\ndef extract_question_info(html_content: str) ->\
          \ Dict[str, Any]:\n    \"\"\"\n    Extract comprehensive question information\
          \ from HTML table.\n\n    Args:\n        html_content (str): HTML content\
          \ containing table data\n\n    Returns:\n        Dict[str, Any]: Dictionary\
          \ containing extracted information\n    \"\"\"\n    result = {\n       \
          \ 'title': None,\n        'question_number': None,\n        'total_marks':\
          \ None,\n        'ao1_ao2_marks': None,\n        'ao3_marks': None,\n  \
          \      'ao1_ao2_content': [],\n        'ao3_content': [],\n        'marking_levels':\
          \ []\n    }\n\n    try:\n        # Extract table content using regex\n \
          \       table_pattern = r'<table.*?>(.*?)</table>'\n        tables = re.findall(table_pattern,\
          \ html_content,\n                            re.DOTALL | re.IGNORECASE)\n\
          \n        for table_content in tables:\n            # Extract rows\n   \
          \         row_pattern = r'<tr.*?>(.*?)</tr>'\n            rows = re.findall(row_pattern,\
          \ table_content,\n                              re.DOTALL | re.IGNORECASE)\n\
          \n            # Process first table (question info)\n            if len(rows)\
          \ >= 2:\n                cell_pattern = r'<td[^>]*>(.*?)</td>'\n       \
          \         first_row_cells = re.findall(\n                    cell_pattern,\
          \ rows[0], re.DOTALL | re.IGNORECASE)\n                headers = [html.unescape(\n\
          \                    re.sub(r'<[^>]+>', '', cell).strip()) for cell in first_row_cells]\n\
          \n                if 'Question' in headers and 'Answer' in headers:\n  \
          \                  for row in rows[1:]:\n                        cells =\
          \ re.findall(\n                            cell_pattern, row, re.DOTALL\
          \ | re.IGNORECASE)\n                        if len(cells) >= 3:\n      \
          \                      result['question_number'] = html.unescape(\n    \
          \                            re.sub(r'<[^>]+>', '', cells[0])).strip()\n\
          \                            answer_text = html.unescape(\n            \
          \                    re.sub(r'<[^>]+>', '', cells[1])).strip()\n       \
          \                     result['total_marks'] = html.unescape(\n         \
          \                       re.sub(r'<[^>]+>', '', cells[2])).strip()\n\n  \
          \                          # Extract AO1+AO2 and AO3 marks from answer text\n\
          \                            ao1_ao2_pattern = r'AO1 and AO2 out of (\\\
          d+) marks'\n                            ao1_ao2_match = re.search(ao1_ao2_pattern,\
          \ answer_text)\n                            if ao1_ao2_match:\n        \
          \                        result['ao1_ao2_marks'] = ao1_ao2_match.group(1)\n\
          \n                            ao3_pattern = r'AO3 out of (\\d+) marks'\n\
          \                            ao3_match = re.search(ao3_pattern, answer_text)\n\
          \                            if ao3_match:\n                           \
          \     result['ao3_marks'] = ao3_match.group(1)\n\n                     \
          \       # Extract title\n                            result['title'] = extract_title_from_html(\n\
          \                                html_content)\n                       \
          \     break\n\n            # Process indicative content table\n        \
          \    cell_pattern = r'<td[^>]*>(.*?)</td>'\n            current_ao_section\
          \ = None  # Track current AO section\n            \n            for row\
          \ in rows:\n                cells = re.findall(cell_pattern, row,\n    \
          \                               re.DOTALL | re.IGNORECASE)\n           \
          \     if len(cells) > 0:\n                    cell_texts = [html.unescape(\n\
          \                        re.sub(r'<[^>]+>', '', cell)).strip() for cell\
          \ in cells]\n                    cell_text = ' '.join(cell_texts)\n\n  \
          \                  # Look for AO section headers\n                    if\
          \ 'AO1 Knowledge and understanding and AO2 Analysis' in cell_text:\n   \
          \                     current_ao_section = 'ao1_ao2'\n                 \
          \       continue\n                    elif 'AO3 Evaluation' in cell_text:\n\
          \                        current_ao_section = 'ao3'\n                  \
          \      continue\n                    elif 'Indicative content' in cell_text:\n\
          \                        continue\n                    elif 'Responses may\
          \ include:' in cell_text:\n                        continue\n          \
          \          elif 'Level 1' in cell_text or 'Level 2' in cell_text or 'Level\
          \ 3' in cell_text:\n                        result['marking_levels'].append(cell_text)\n\
          \                    elif cell_text and len(cell_text) > 10 and not cell_text.isdigit():\n\
          \                        # Skip rows that contain answer text from first\
          \ table\n                        if 'AO1 and AO2 out of' in cell_text or\
          \ 'AO3 out of' in cell_text:\n                            continue\n   \
          \                     \n                        # Classify content based\
          \ on current AO section\n                        if current_ao_section ==\
          \ 'ao1_ao2':\n                            result['ao1_ao2_content'].append(cell_text)\n\
          \                        elif current_ao_section == 'ao3':\n           \
          \                 result['ao3_content'].append(cell_text)\n            \
          \            else:\n                            # If no specific section,\
          \ try to classify by content\n                            if any(keyword\
          \ in cell_text.lower() for keyword in ['knowledge', 'understanding', 'analysis',\
          \ 'factor', 'cause', 'reason']):\n                                result['ao1_ao2_content'].append(cell_text)\n\
          \                            elif any(keyword in cell_text.lower() for keyword\
          \ in ['evaluation', 'assess', 'judge', 'effectiveness', 'success', 'failure']):\n\
          \                                result['ao3_content'].append(cell_text)\n\
          \n    except Exception as e:\n        print(f\"Error extracting question\
          \ info: {e}\")\n\n    return result\n\n\ndef main(arg1: str):\n    data\
          \ = json.loads(arg1)\n    result = data.get('result')\n    result = result.get('markdown')\n\
          \n    result = extract_question_info(result)\n\n    return {\n        \"\
          ao1_ao2_criteria\": result[\"ao1_ao2_content\"],\n        \"ao3_criteria\"\
          : result[\"ao3_content\"],\n        \"marking_levels\": result[\"marking_levels\"\
          ]\n    }"
        code_language: python3
