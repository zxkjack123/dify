    - data:
        code: "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\n文本分割器\n基于split_string.py扩展，支持多种分割方式\n\
          \"\"\"\n\nimport re\n\n\ndef split_by_delimiters(text: str) -> list:\n \
          \   \"\"\"\n    将以分号、逗号或空格分隔的字符串拆分为字符串数组\n    基于原始split_string.py的功能\n \
          \   \"\"\"\n    if not text:\n        return []\n\n    # 使用正则表达式分割，忽略连续分隔符和首尾空白\n\
          \    parts = [s for s in re.split(r'[;, ]+', text.strip()) if s]\n    return\
          \ parts\n\n\ndef split_by_lines(content: str, skip_first_line: bool = False,\
          \ keyword: str = \"\") -> list:\n    \"\"\"\n    将内容按行分割，可选择跳过第一行\n\n  \
          \  参数:\n        content: 要分割的内容\n        skip_first_line: 是否跳过第一行\n    \
          \    keyword: 关键词，用于判断是否跳过第一行\n    \"\"\"\n    if not content:\n       \
          \ return []\n\n    # 按换行符分割，过滤空行\n    lines = [line.strip() for line in\
          \ content.split('\\n') if line.strip()]\n\n    # 如果需要跳过第一行且第一行包含关键词或看起来像标题\n\
          \    if skip_first_line and lines:\n        if keyword and keyword.lower()\
          \ in lines[0].lower():\n            return lines[1:] if len(lines) > 1 else\
          \ []\n        elif any(title in lines[0] for title in ['Question Answer\
          \ Marks', 'content']):\n            return lines[1:] if len(lines) > 1 else\
          \ []\n\n    return lines\n\n\ndef split_by_paragraphs(content: str) -> list:\n\
          \    \"\"\"\n    将内容按段落分割（以双换行符分割）\n    \"\"\"\n    if not content:\n  \
          \      return []\n\n    # 按双换行符分割段落\n    paragraphs = [p.strip() for p in\
          \ content.split('\\n\\n') if p.strip()]\n    return paragraphs\n\n\ndef\
          \ split_by_factors(content: str) -> list:\n    \"\"\"\n    专门用于分割AO3因子的函数\n\
          \    提取Factor 1, Factor 2, ... 等有编号的因素\n    \"\"\"\n    if not content:\n\
          \        return []\n\n    # 提取所有factors的正则表达式\n    factor_pattern = re.compile(\n\
          \        r'(?:^|\\n)[\\s\\-\\*#]*Factor\\s*(\\d+)\\s*[:：]?\\s*(.*?)(?=(?:^|\\\
          n)[\\s\\-\\*#]*Factor\\s*\\d+|(?:^|\\n)#+\\s*[Cc]onclusion|$)',\n      \
          \  re.IGNORECASE | re.DOTALL | re.MULTILINE\n    )\n\n    factors = []\n\
          \    for match in factor_pattern.finditer(content):\n        num = match.group(1)\n\
          \        rest = match.group(2).strip()\n\n        # 若内容为空，尝试取下一行\n     \
          \   if not rest:\n            lines = content[match.end():].lstrip().split('\\\
          n', 1)\n            if lines:\n                rest = lines[0].strip()\n\
          \n        # 处理因子内容，查找第一个换行符来分离标题和内容\n        lines = rest.split('\\n', 2)\n\
          \        if len(lines) > 1:\n            title_part = lines[0].strip()\n\
          \            reasoning_part = lines[1].strip()\n        else:\n        \
          \    title_part = rest.strip()\n            reasoning_part = ''\n\n    \
          \    # 构建因子标题\n        factor_title = f\"Factor {num}: {title_part}\"\n\
          \        factor_title = re.sub(r'\\s+', ' ', factor_title)\n        reasoning_part\
          \ = re.sub(r'\\s+', ' ', reasoning_part)\n\n        if reasoning_part:\n\
          \            factors.append(f\"{factor_title}\\n{reasoning_part}\")\n  \
          \      else:\n            factors.append(factor_title)\n\n    return factors\n\
          \n\ndef split_by_logics(content: str) -> list:\n    \"\"\"\n    专门用于分割AO2逻辑链的函数\n\
          \    提取Logic 1, Logic 2, ... 等逻辑链\n    \"\"\"\n    if not content:\n   \
          \     return []\n\n    # 清理markdown标记\n    content = re.sub(r'(\\*\\*|__|\\\
          *|_|~~|`)', '', content)\n\n    # 兼容\"#### Topic: Logic X ...\"或\"### Logic\
          \ X ...\"或\"Logic X ...\"等\n    logic_pattern = re.compile(\n        r'(?:^|\\\
          n)\\s*(?:#{2,4}\\s*)?(?:Topic:\\s*)?(Logic\\s*\\d+.*?)(?:\\n|\\r\\n)(.*?)(?=(?:^|\\\
          n)\\s*(?:#{2,4}\\s*)?(?:Topic:\\s*)?Logic\\s*\\d+|^\\s*#{2,3}\\s*AO3|\\\
          Z)',\n        re.IGNORECASE | re.DOTALL\n    )\n\n    logic_chains = []\n\
          \    for match in logic_pattern.finditer(content):\n        title = match.group(1).strip()\n\
          \        body = match.group(2).strip()\n        lines = [line.strip() for\
          \ line in body.split('\\n') if line.strip()]\n        if lines:\n      \
          \      chain = title + '\\n' + '\\n'.join(lines)\n        else:\n      \
          \      chain = title\n        logic_chains.append(chain.strip())\n\n   \
          \ return logic_chains\n\n\ndef split_by_keywords(content: str) -> list:\n\
          \    \"\"\"\n    专门用于分割AO1关键词的函数\n    处理加粗格式、分隔符、项目符号等\n    \"\"\"\n   \
          \ if not content:\n        return []\n\n    keyword_lines = []\n\n    #\
          \ 先找加粗关键词（如**High inflation**）\n    bold_keywords = re.findall(r'\\*\\*([^*]+)\\\
          *\\*', content)\n    if bold_keywords:\n        keyword_lines.extend([kw.strip()\
          \ for kw in bold_keywords])\n\n    # 按分号、逗号分割\n    split_pattern = r'[;,，]'\n\
          \    if re.search(split_pattern, content):\n        for item in re.split(split_pattern,\
          \ content):\n            item = item.strip()\n            # 移除加粗符号\n   \
          \         item = re.sub(r'^\\*+|\\*+$', '', item)\n            if item:\n\
          \                keyword_lines.append(item)\n    else:\n        # 按行处理\n\
          \        for line in content.split('\\n'):\n            line = line.strip()\n\
          \            if not line or line.startswith('#'):\n                continue\n\
          \            # 移除项目符号和加粗\n            clean_line = re.sub(r'^[\\s*•\\-]+\\\
          s*|\\d+[\\.\\)]\\s*', '', line)\n            clean_line = re.sub(r'^\\*+|\\\
          *+$', '', clean_line)\n            # 只取冒号前内容（如\"High inflation: ...\"）\n\
          \            clean_line = clean_line.split(\n                ':')[0].strip()\
          \ if ':' in clean_line else clean_line\n            if clean_line:\n   \
          \             keyword_lines.append(clean_line)\n\n    # 二次清洗：移除首尾标点和重复\n\
          \    cleaned_keywords = []\n    seen = set()\n    for kw in keyword_lines:\n\
          \        kw = re.sub(r'^[,.;\\s]+|[,.;\\s]+$', '', kw)\n        if kw and\
          \ kw not in seen:\n            cleaned_keywords.append(kw)\n           \
          \ seen.add(kw)\n\n    return cleaned_keywords\n\n\ndef split_by_sentences(content:\
          \ str) -> list:\n    \"\"\"\n    将内容按句子分割\n    \"\"\"\n    if not content:\n\
          \        return []\n\n    # 简单的句子分割，基于句号、问号、感叹号\n    sentences = re.split(r'[.!?]',\
          \ content)\n    sentences = [s.strip() for s in sentences if s.strip()]\n\
          \    return sentences\n\n\ndef main(arg1: str) -> dict:\n    \"\"\"\n  \
          \  主函数，根据指定类型分割内容\n\n    参数:\n        arg1: 要分割的内容\n    注意: 请在代码中手动设置split_type和其他参数的值\n\
          \    \"\"\"\n    # 用户需要手动设置这些参数值\n    # 请根据需要修改: \"delimiters\", \"lines\"\
          , \"paragraphs\", \"sentences\", \"factors\", \"logics\", \"keywords\"\n\
          \    split_type = \"lines\"\n    skip_first_line = False           # 是否跳过第一行\
          \ (仅对lines类型有效)\n    keyword = \"\"                      # 关键词参数 (仅对lines类型有效)\n\
          \n    if split_type == \"delimiters\":\n        result = split_by_delimiters(arg1)\n\
          \    elif split_type == \"lines\":\n        result = split_by_lines(arg1,\
          \ skip_first_line, keyword)\n    elif split_type == \"paragraphs\":\n  \
          \      result = split_by_paragraphs(arg1)\n    elif split_type == \"sentences\"\
          :\n        result = split_by_sentences(arg1)\n    elif split_type == \"\
          factors\":\n        result = split_by_factors(arg1)\n    elif split_type\
          \ == \"logics\":\n        result = split_by_logics(arg1)\n    elif split_type\
          \ == \"keywords\":\n        result = split_by_keywords(arg1)\n    else:\n\
          \        # 默认按行分割\n        result = split_by_lines(arg1)\n\n    return {\n\
          \        \"result\": result,\n        \"num_parts\": len(result)\n    }\n\
          \n"
        code_language: python3
