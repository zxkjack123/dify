          role: system
          text: "{{#1753369949606.ao1_ao2_criteria#}}的内容由OCR扫描得到的一个经济学英语作文的评分标准与要求。{{#1753369949606.ao1_ao2_criteria#}}存在换行不合理的问题。根据其语义，整理句子，分为多个段落。上下内容紧密的部分放在一起，作为一个小段落，使用“\\\
            n”作为段落间分隔符。\n\n## 要求\n- 不对句子的单词进行任何修改，仅改变多行文本间的分割位置\n\n\n- 请明确区分AO1和AO2的内容。在每一条AO1标准前加上'[AO1]'前缀，在每一条AO2标准前加上'[AO2]'前缀。\n\
            \n## 输出\n- 语句重组后的评分标准与要求ao1_ao2_criteria\n- 以json格式输出\n\n```json\n{ \n\
            ao1_ao2_criteria: str\n}\n```"
        selected: false
        title: 整理AO1AO2得分点
