    - data:
        code: "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\nAO3评估内容提取脚本\
          \ - Dify Code Block专用版本\n消除所有DeprecationWarning，确保在Dify中稳定运行\n\"\"\"\n\n\
          import re\nimport json\nfrom html import unescape\n\n# 预编译所有正则表达式模式，避免运行时警告\n\
          MARKDOWN_PATTERN = re.compile(r'(\\*\\*|__|\\*|_|~~|`)')\nHTML_PATTERN =\
          \ re.compile(r'<[^>]+>')\nSPACE_PATTERN = re.compile(r'[ \\t]+')\nQUOTE_END_PATTERN\
          \ = re.compile(r'\"\\s*$')\nQUOTE_START_PATTERN = re.compile(r'^\\s*\"')\n\
          \nTHINK_PATTERN = re.compile(r'<think>.*?</think>', re.DOTALL | re.IGNORECASE)\n\
          THINK_TAG_PATTERN = re.compile(r'</?think>', re.IGNORECASE)\n\n# AO3识别模式\n\
          AO3_PATTERNS = [\n    re.compile(r'(?:^|\\n)\\s*第[一二三四五六七八九十]+种\\s*evaluation\\\
          s*[:：]?', re.MULTILINE | re.IGNORECASE),\n    re.compile(r'(?:^|\\n)\\s*AO3\\\
          s*[:：]\\s*Evaluation', re.MULTILINE | re.IGNORECASE),\n    re.compile(r'(?:^|\\\
          n)\\s*AO3\\s*[:：]?', re.MULTILINE | re.IGNORECASE),\n    re.compile(r'(?:^|\\\
          n)\\s*Evaluation\\s*[:：–-]\\s*The\\s+success', re.MULTILINE | re.IGNORECASE),\n\
          \    re.compile(r'(?:^|\\n)\\s*Factor\\s+\\d+\\s*[:：]\\s*Depends\\s+on',\
          \ re.MULTILINE | re.IGNORECASE),\n    re.compile(r'(?:^|\\n)\\s*评估—?供给侧政策',\
          \ re.MULTILINE | re.IGNORECASE),\n    re.compile(r'(?:^|\\n)\\s*因素\\d+：取决于',\
          \ re.MULTILINE | re.IGNORECASE),\n    re.compile(r'(?:^|\\n)\\s*Evaluation\\\
          s*[:：–-]', re.MULTILINE | re.IGNORECASE),\n    re.compile(r'(?:^|\\n)\\\
          s*评估\\s*[:：–-]', re.MULTILINE | re.IGNORECASE)\n]\n\n# 因素提取模式\nFACTOR_PATTERNS\
          \ = [\n    re.compile(r'(?:^|\\n)\\s*Factor\\s+\\d+\\s*[:：]\\s*Depends\\\
          s+on.*?(?=Factor\\s+\\d+|$)', \n               re.DOTALL | re.MULTILINE\
          \ | re.IGNORECASE),\n    re.compile(r'(?:^|\\n)\\s*因素\\d+：取决于.*?(?=因素\\\
          d+：|$)', \n               re.DOTALL | re.MULTILINE | re.IGNORECASE),\n \
          \   re.compile(r'(?:^|\\n)\\s*Factor\\s+\\d+\\s*[:：].*?(?=Factor\\s+\\d+|Conclusion|结论|$)',\
          \ \n               re.DOTALL | re.MULTILINE | re.IGNORECASE)\n]\n\n# 结论提取模式\n\
          CONCLUSION_PATTERNS = [\n    re.compile(r'(?:^|\\n)\\s*#?\\s*Conclusion\\\
          s*\\n(.*?)$', re.DOTALL | re.MULTILINE | re.IGNORECASE),\n    re.compile(r'(?:^|\\\
          n)\\s*#?\\s*结论\\s*\\n(.*?)$', re.DOTALL | re.MULTILINE | re.IGNORECASE),\n\
          \    re.compile(r'(?:^|\\n)\\s*In\\s+conclusion\\s*,?(.*?)$', re.DOTALL\
          \ | re.MULTILINE | re.IGNORECASE),\n    re.compile(r'(?:^|\\n)\\s*总之\\s*，?(.*?)$',\
          \ re.DOTALL | re.MULTILINE | re.IGNORECASE)\n]\n\n\ndef clean_markdown(text):\n\
          \    \"\"\"\n    清理markdown标记、HTML标签、think标签和转义字符\n    整合所有文本清理功能，避免DeprecationWarning\n\
          \    \"\"\"\n    if not text:\n        return \"\"\n    \n    # 处理转义字符和HTML实体\n\
          \    try:\n        text = unescape(text)\n        # 使用字符码来避免反斜杠转义问题\n  \
          \      newline_escape = chr(92) + 'n'  # 代表 \\n\n        tab_escape = chr(92)\
          \ + 't'      # 代表 \\t\n        \n        # 只在确实需要时才进行转换\n        if newline_escape\
          \ in text or tab_escape in text:\n            try:\n                text\
          \ = text.encode('utf-8').decode('unicode_escape')\n            except Exception:\n\
          \                # 使用字符替换的安全方式\n                text = text.replace(newline_escape,\
          \ '\\n')\n                text = text.replace(tab_escape, '\\t')\n    except\
          \ Exception:\n        pass  # 保持原文本\n    \n    # 移除think标签\n    text = THINK_PATTERN.sub('',\
          \ text)\n    text = THINK_TAG_PATTERN.sub('', text)\n    \n    # 移除markdown标记\n\
          \    text = MARKDOWN_PATTERN.sub('', text)\n    text = HTML_PATTERN.sub('',\
          \ text)\n    text = SPACE_PATTERN.sub(' ', text)\n    \n    # 使用字符码来避免转义序列警告\n\
          \    text = text.replace(chr(92) + '\"', '\"')     # \\\"\n    text = text.replace(chr(92)\
          \ + chr(92), chr(92))  # \\\\\n    text = text.replace(chr(92) + 'n', '\\\
          n')    # \\n\n\n    # 处理引号\n    text = text.strip()\n    if text.startswith('\"\
          ') and text.endswith('\"') and len(text) > 2:\n        inner_content = text[1:-1]\n\
          \        if inner_content.count('\"') % 2 == 0:\n            text = inner_content\n\
          \n    text = QUOTE_END_PATTERN.sub('', text)\n    text = QUOTE_START_PATTERN.sub('',\
          \ text)\n\n    return text.strip()\n\n\ndef extract_ao3_content(text):\n\
          \    \"\"\"\n    从文本中提取AO3评估部分，排除AO1和AO2内容\n    \"\"\"\n    if not text:\n\
          \        return None\n        \n    ao3_start = None\n    earliest_start\
          \ = len(text)\n\n    # 使用预编译的模式查找AO3标记\n    for pattern in AO3_PATTERNS:\n\
          \        matches = list(pattern.finditer(text))\n        if matches:\n \
          \           for match in matches:\n                if match.start() < earliest_start:\n\
          \                    earliest_start = match.start()\n                  \
          \  ao3_start = match.start()\n\n    if ao3_start is None:\n        return\
          \ None\n\n    return text[ao3_start:].strip()\n\n\ndef extract_evaluation_factors(text):\n\
          \    \"\"\"\n    专门提取评估因素（Factor 1, Factor 2等）\n    \"\"\"\n    if not text:\n\
          \        return None\n        \n    factors = []\n\n    for pattern in FACTOR_PATTERNS:\n\
          \        matches = pattern.finditer(text)\n        for match in matches:\n\
          \            factor_content = match.group(0).strip()\n            if factor_content\
          \ and factor_content not in factors:\n                factors.append(factor_content)\n\
          \n    return '\\n\\n'.join(factors) if factors else None\n\n\ndef extract_conclusion(text):\n\
          \    \"\"\"\n    专门提取结论部分\n    \"\"\"\n    if not text:\n        return\
          \ None\n        \n    for pattern in CONCLUSION_PATTERNS:\n        match\
          \ = pattern.search(text)\n        if match:\n            conclusion_content\
          \ = match.group(0).strip()\n            if conclusion_content:\n       \
          \         return conclusion_content\n\n    return None\n\n\ndef extract_specific_ao3_section(text,\
          \ section_type):\n    \"\"\"\n    提取特定的AO3部分\n    section_type: \"full\"\
          \ (完整AO3), \"factors\" (仅评估因素), \"conclusion\" (仅结论)\n    \"\"\"\n    if\
          \ not text:\n        return None\n        \n    section_type = section_type.lower()\n\
          \    \n    if section_type == \"factors\":\n        return extract_evaluation_factors(text)\n\
          \    elif section_type == \"conclusion\":\n        return extract_conclusion(text)\n\
          \    else:  # \"full\" 或其他\n        return extract_ao3_content(text)\n\n\
          \ndef process_text(input_text, extract_mode=\"full\"):\n    \"\"\"\n   \
          \ 完整的文本处理流程\n    extract_mode: \"full\" (完整AO3), \"factors\" (仅评估因素), \"\
          conclusion\" (仅结论)\n    \"\"\"\n    if not input_text:\n        return \"\
          \"\n    \n    # 1. 根据模式提取内容（直接使用输入文本）\n    content = extract_specific_ao3_section(input_text,\
          \ extract_mode)\n\n    # 2. 对提取的内容应用统一的清理（包括转义字符、think标签、markdown等）\n  \
          \  if content:\n        content = clean_markdown(content)\n\n    # 3. 返回清理后的内容\n\
          \    return content if content else \"\"\n\n\ndef main(arg1: str) -> dict:\n\
          \    \"\"\"\n    主函数，用于Dify Code Block\n    arg1: 输入文本\n    提取AO3评估部分\n\
          \    \"\"\"\n    try:\n        # 可以修改这个参数来改变提取模式\n        extract_mode =\
          \ \"full\"  # \"full\", \"factors\", \"conclusion\"\n        \n        result_content\
          \ = process_text(arg1, extract_mode)\n        \n        return {\n     \
          \       \"result\": result_content\n        }\n    except Exception as e:\n\
