    - data:
        code: "\nimport re\nimport json\nfrom html import unescape\n\ndef clean_markdown(text):\n\
          \    \"\"\"Clean markdown and HTML tags.\"\"\"\n    if not text: return\
          \ \"\"\n    # Remove markdown emphasis and code blocks\n    text = re.sub(r'(\\\
          *\\*|__|[*_`]|~~)', '', text)\n    # Remove HTML tags\n    text = re.sub(r'<[^>]+>',\
          \ '', text)\n    # Normalize whitespace\n    text = re.sub(r'\\s+', ' ',\
          \ text)\n    # Handle escaped characters\n    text = text.replace('\\\\\"\
          ', '\"').replace('\\\\\\\\', '\\\\').replace('\\\\n', '\\n')\n    \n   \
          \ text = text.strip()\n    # Remove surrounding quotes if present and balanced\n\
          \    if len(text) > 2 and text.startswith('\"') and text.endswith('\"'):\n\
          \        inner = text[1:-1]\n        if inner.count('\"') % 2 == 0:\n  \
          \          text = inner\n            \n    # Remove trailing/leading quotes\n\
          \    text = re.sub(r'^\"|\"$', '', text.strip())\n    return text.strip()\n\
          \ndef clean_input_text(text):\n    \"\"\"Clean input text, removing think\
          \ tags and decoding entities.\"\"\"\n    if not text: return \"\"\n    \n\
          \    try:\n        text = unescape(text)\n        # Decode unicode escape\
          \ if needed\n        if '\\\\n' in text or '\\\\t' in text:\n          \
          \  try:\n                text = text.encode('utf-8').decode('unicode_escape')\n\
          \            except:\n                text = text.replace('\\\\n', '\\n').replace('\\\
          \\t', '\\t')\n    except:\n        pass\n\n    # Remove <think> blocks\n\
          \    text = re.sub(r'<think>.*?</think>', '', text, flags=re.DOTALL | re.IGNORECASE)\n\
          \    text = re.sub(r'</?think>', '', text, flags=re.IGNORECASE)\n    return\
          \ text.strip()\n\ndef extract_from_json(text, keyword):\n    \"\"\"Extract\
          \ content from JSON format.\"\"\"\n    # Try parsing full text\n    try:\n\
          \        data = json.loads(text)\n        if isinstance(data, dict) and\
          \ keyword in data:\n            return str(data[keyword])\n    except:\n\
          \        pass\n\n    # Try finding JSON block with regex (greedy)\n    #\
          \ Looks for the largest outer {} block containing the keyword\n    try:\n\
          \        matches = list(re.finditer(r'\\{.*\\}', text, re.DOTALL))\n   \
          \     if matches:\n            # Try the longest match first (likely the\
          \ full JSON)\n            for match in sorted(matches, key=lambda m: len(m.group(0)),\
          \ reverse=True):\n                json_str = match.group(0)\n          \
          \      if keyword in json_str:\n                    try:\n             \
          \           data = json.loads(json_str)\n                        if isinstance(data,\
          \ dict) and keyword in data:\n                            return str(data[keyword])\n\
          \                    except:\n                        continue\n    except:\n\
          \        pass\n        \n    return None\n\ndef extract_by_markers(text,\
          \ keyword):\n    \"\"\"Extract content using text markers.\"\"\"\n    #\
          \ Pattern: keyword: content\n    pattern = rf'{re.escape(keyword)}\\s*[:：]\\\
          s*(.*?)(?:\\n\\n|\\Z)'\n    match = re.search(pattern, text, re.DOTALL)\n\
          \    if match:\n        return match.group(1).strip()\n        \n    # Pattern:\
          \ keyword (newline) content\n    pattern = rf'(?:^|\\n)\\s*{re.escape(keyword)}\\\
          s*(?:[:：]?)?\\s*\\n?(.*?)(?:\\n\\n|\\n(?=[A-Z][^a-z]*[:：]?)|$)'\n    match\
          \ = re.search(pattern, text, re.DOTALL | re.MULTILINE)\n    if match:\n\
          \        return match.group(1).strip()\n    return None\n\ndef process_text(input_text,\
          \ keyword):\n    \"\"\"Main processing pipeline.\"\"\"\n    text = clean_input_text(input_text)\n\
          \    \n    content = extract_from_json(text, keyword)\n    if not content:\n\
          \        content = extract_by_markers(text, keyword)\n        \n    # Fallback:\
          \ if text is short and looks like the content itself (and not a container)\n\
          \    # and we failed to find the keyword, maybe the whole text is the content?\n\
          \    # But only if we are desperate. For now, return empty if not found.\n\
          \    \n    if content:\n        return clean_markdown(content)\n    return\
          \ \"\"\n\ndef main(arg1: str) -> dict:\n    \"\"\"\n    Entry point.\n \
          \   arg1: Input text\n    \"\"\"\n    keyword = \"ao1_ao2_criteria\"\n \
          \   \n    result = process_text(arg1, keyword)\n    return {\n        \"\
          result\": result\n    }\n"
