          \ diagram_credit: int) -> dict:\n    ao1_total = 0\n    ao1_matched = 0\n\
          \    ao2_total = 0\n    ao2_matched = 0\n    \n    if not iteration_output:\n\
          \        iteration_output = []\n        \n    for item_str in iteration_output:\n\
          \        try:\n            # Handle if item is already dict (unlikely in\
          \ Dify code node input, usually string)\n            if isinstance(item_str,\
          \ dict):\n                item = item_str\n            else:\n         \
          \       item = json.loads(item_str)\n                \n            is_match\
          \ = item.get(\"match\")\n            if isinstance(is_match, str):\n   \
          \             is_match = is_match.lower() == \"true\"\n            \n  \
          \          item_type = item.get(\"type\", \"\").upper()\n            \n\
          \            if \"AO1\" in item_type:\n                ao1_total += 1\n\
          \                if is_match: ao1_matched += 1\n            elif \"AO2\"\
          \ in item_type:\n                ao2_total += 1\n                if is_match:\
          \ ao2_matched += 1\n            else:\n                # If type is unknown,\
          \ try to guess or just count as total\n                # For safety, let's\
          \ assume it contributes to total count but which one?\n                #\
          \ Maybe check 'reason' or other fields? \n                # Let's just skip\
          \ counting it for specific AO scores but maybe add to total?\n         \
          \       pass\n        except:\n            continue\n            \n    total_ms\
          \ = ao1_total + ao2_total\n    total_matched = ao1_matched + ao2_matched\n\
          \    \n    total_point = 0\n    if total_ms > 0:\n        total_point =\
          \ (total_matched / total_ms) * upper_limit + diagram_credit\n        total_point\
          \ = min(total_point, upper_limit)\n        \n    return {\n        \"result\"\
          : total_point,\n        \"ao1_score\": ao1_matched,\n        \"ao1_total\"\
          : ao1_total,\n        \"ao2_score\": ao2_matched,\n        \"ao2_total\"\
          : ao2_total\n    }\n"
